<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>SCDIO — Pirâmide Aiken Adaptada · IPPUC</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Arial,sans-serif;background:#111927;color:#d8e4f0;min-height:100vh;font-size:11px}
/* ═══ HEADER ═══ */.hdr{  background:linear-gradient(90deg,#080f1a 0%,#0f2240 100%);  border-bottom:2px solid #1e5a9e;  padding:7px 14px;  display:flex;align-items:center;justify-content:space-between;gap:8px;  flex-wrap:wrap;}.hdr-t{font-size:12px;font-weight:700;color:#e8f2ff;line-height:1.2}.hdr-s{font-size:8px;color:#6a8aaa;margin-top:2px}.nav{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.btn{background:rgba(30,90,158,.35);color:#7ab0e0;border:1px solid rgba(30,90,158,.55);border-radius:4px;padding:4px 11px;font-size:10px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}.btn:hover:not(:disabled){background:rgba(30,90,158,.65);color:#fff}.btn:disabled{opacity:.3;cursor:default}.btn-p{background:#1e5a9e;color:#fff;font-weight:700;border-color:#1e5a9e}.btn-p:hover:not(:disabled){background:#163f70}.sel{background:#080f1a;color:#7ab0e0;border:1px solid rgba(30,90,158,.55);border-radius:4px;padding:4px 7px;font-size:10px;cursor:pointer;font-family:inherit}.sel option{background:#080f1a}.vsep{width:1px;height:16px;background:rgba(255,255,255,.1);flex-shrink:0}.pgw{display:flex;align-items:center;gap:5px;font-size:9px;color:#6a8aaa;white-space:nowrap}.pgb{width:70px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}.pgf{height:100%;background:#1e5a9e;border-radius:2px;transition:width .4s}
/* ═══ STAGE TITLE ═══ */.stage{display:flex;align-items:center;gap:7px;padding:6px 14px 5px}.stg-n{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}.stg-h{font-size:13px;font-weight:700;color:#ddeeff}.stg-s{font-size:8px;color:#6a8aaa;margin-top:1px}
/* ═══ MAIN LAYOUT ═══   Left col (fixed 180px): Pyramid + Radar     Center col (fixed 178px): Backlog + Input box + Output box     Right col (flex): 3×4 card grid*/.wrap{  display:grid;  grid-template-columns:180px 178px 1fr;  gap:6px;  padding:6px 10px 16px;  align-items:start;  overflow:visible;}
/* ─── LEFT COL ─── */.lc{display:flex;flex-direction:column;gap:5px}
/* Pyramid */.pyr-wrap{background:#080f1a;border:1px solid #1a3050;border-radius:6px;padding:7px;display:flex;flex-direction:column;align-items:center}.pyr-cap{font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#2a5070;margin-bottom:3px}
/* Radar */.rad-wrap{background:#080f1a;border:1px solid #1a3050;border-radius:6px;padding:7px;display:flex;flex-direction:column;align-items:center}.rad-cap{font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#2a5070;margin-bottom:2px;width:100%}
/* Delta bars */.dt{width:100%;margin-top:4px;padding-top:4px;border-top:1px solid #1a3050}.dt-name{font-size:7px;font-weight:700;text-align:center;margin-bottom:2px}.dt-row{display:flex;align-items:center;gap:3px;margin-bottom:2px}.dt-lbl{font-size:6.5px;color:#2a5070;width:30px;text-align:right;flex-shrink:0}.dt-bw{flex:1;background:rgba(255,255,255,.05);border-radius:2px;height:4px;overflow:hidden}.dt-bi{height:100%;border-radius:2px;transition:width .5s}.dt-val{font-size:6.5px;font-weight:600;width:18px;flex-shrink:0}.dt-gain{margin-top:2px;text-align:center;font-size:8px;font-weight:700}
/* Info boxes */.ibox{background:#080f1a;border:1px solid #1a3050;border-radius:6px;padding:6px}.ibox-t{font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;padding-bottom:2px;border-bottom:1px solid #1a3050}.ibox-b{font-size:8px;color:#5a7a90;line-height:1.45}.otags{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:3px}.otag{font-size:6.5px;font-weight:600;padding:1px 5px;border-radius:2px}.isub{margin-top:3px;padding-top:3px;border-top:1px solid #1a3050;font-size:7px;color:#3a5060;line-height:1.4}.isub b{font-size:6.5px;text-transform:uppercase;letter-spacing:.3px;color:#4a6070}
/* ─── CENTER COL ─── */.cc{display:flex;flex-direction:column;gap:6px;overflow:visible}.bl-wrap{background:#080f1a;border:1px solid #1a3050;border-radius:6px;padding:6px}.bl-t{font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#1e5a9e;margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid #1a3050}.bli{display:flex;align-items:center;gap:4px;padding:2px 3px;border-radius:3px;font-size:7.5px;cursor:pointer;transition:.1s;color:#3a5a70;margin-bottom:1px;border-bottom:1px solid rgba(20,50,80,.4);border-left:2px solid transparent}.bli:hover{background:rgba(30,90,158,.12)}.bli.cur{background:rgba(30,90,158,.2);color:#a0c8e8;font-weight:600;border-left-color:#1e5a9e}.bli.done{color:#1e3a50}.bli.done .bll{text-decoration:line-through}.bld{width:5px;height:5px;border-radius:50%;flex-shrink:0}.bok{margin-left:auto;color:#16a34a;font-size:7.5px;flex-shrink:0}.btg{margin-left:auto;font-size:5.5px;font-weight:700;padding:1px 3px;border-radius:2px;color:#fff;flex-shrink:0}
/* ─── RIGHT COL ─── */.rc{display:flex;flex-direction:column;gap:5px;overflow:visible}/* each row is a 4-col grid; active card wider */.grow{display:grid;gap:5px;overflow:visible}
/* Card states */.mcw{position:relative}.mc{border-radius:5px;border:1px solid #1a3050;background:#050d16;cursor:pointer;transition:transform .15s,box-shadow .15s;min-height:75px;overflow:visible}.mc:hover:not(.lk){transform:translateY(-1px)}.mc.act{border-width:1.5px}.mc.dn{background:#040d08;border-color:#0e3a18}.mc.lk{opacity:.22;pointer-events:none}.mc-h{padding:4px 6px 3px;font-size:8px;font-weight:700;line-height:1.2;text-decoration:underline}.mc-h small{display:block;font-size:6px;font-weight:400;text-decoration:none;opacity:.75;margin-top:1px}.mc-b{padding:3px 6px 4px;display:grid;grid-template-columns:1fr 1fr;gap:2px 3px}.mc-l{font-size:5.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:#2a5070;margin-bottom:1px}.mc-v{font-size:6.5px;color:#3a6078;line-height:1.2}.mc-lk{padding:8px 6px;font-size:7px;color:#1a3a50;text-align:center;font-style:italic}
/* Expand on hover */.mcx{display:none;position:absolute;z-index:1000;top:0;left:0;width:280px;background:#050d16;border:2px solid;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.95);pointer-events:none}/* last 2 cards in row: open left */.mcw:nth-child(3) .mcx,.mcw:nth-child(4) .mcx{left:auto;right:0}/* last row: open up */.grow:last-child .mcx{top:auto;bottom:0}.grow:first-child .mcx{bottom:auto;top:0}.mcw:hover .mcx{display:block}.xh{padding:5px 8px;font-size:9px;font-weight:700;color:#fff;border-radius:4px 4px 0 0}.xd{padding:3px 8px;font-size:7px;color:#708090;line-height:1.4;border-bottom:1px solid #1a3050}.xg{padding:3px 8px;border-bottom:1px solid #1a3050}.xg-l{font-size:6px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}.xg li{font-size:6.5px;color:#708090;line-height:1.3;margin-left:9px;margin-bottom:1px}.x3{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid #1a3050}.xc{padding:3px 5px}.xc+.xc">border-left:1px solid #1a3050}.xc-h{font-size:6px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;padding-bottom:1px;border-bottom:1px solid #1a3050}.xc li{font-size:6px;color:#708090;line-height:1.3;margin-left:7px;margin-bottom:1px}.xf{padding:2px 8px;font-size:5.5px;color:#2a5070;font-style:italic;text-align:right}
@keyframes fi{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}.ani{animation:fi .22s ease both}</style></head><body>
<div class="hdr">  <div>    <div class="hdr-t">SCDIO — Implementação DMBOK / Pirâmide Aiken Adaptada · IPPUC · Plano Diretor de Curitiba</div>    <div class="hdr-s">12 Dimensões DMBOK · 4 Fases Aiken · 2025–2027 · Mouse sobre os diagramas para expandir · ← → para navegar</div>  </div>  <div class="nav">    <div class="pgw"><span id="plbl">Dimensão 1/12</span><div class="pgb"><div class="pgf" id="pgf"></div></div></div>    <div class="vsep"></div>    <button class="btn" id="bprev" onclick="go(-1)">◀ Ant.</button>    <select class="sel" id="jt" onchange="jmp(+this.value)"></select>    <button class="btn btn-p" id="bnext" onclick="go(1)">Próx. ▶</button>    <div class="vsep"></div>    <select class="sel" id="je" onchange="jmpE(+this.value)"></select>  </div></div>
<div class="stage">  <div class="stg-n" id="stgn">1</div>  <div>    <div class="stg-h" id="stgh">Q1 — Armazenamento e Operações</div>    <div class="stg-s" id="stgs"></div>  </div></div>
<div class="wrap ani" id="wrap">  <div class="lc" id="lc"></div>  <div class="cc">    <div class="bl-wrap">      <div class="bl-t">Backlog — 12 Dimensões DMBOK</div>      <div id="blist"></div>    </div>    <div id="io-container" style="display: flex; flex-direction: column; gap: 6px;"></div>  </div>  <div class="rc" id="rc"></div></div>
<script>// ═══════════════════════════════════════════════════════════════════════// CORES por dimensão DMBOK (1-12)// ═══════════════════════════════════════════════════════════════════════const C={1:'#185FA5',2:'#2E75B6',3:'#0F6E56',4:'#7030A0',5:'#1D9E75',         6:'#3A86C8',7:'#C9511F',8:'#1F4E79',9:'#666660',10:'#3B6D11',         11:'#854F0B',12:'#A32D2D'};const DIM_MAX=5;
// ═══════════════════════════════════════════════════════════════════════// MAPEAMENTO: função DMBOK → dimensão numérica// ═══════════════════════════════════════════════════════════════════════const FUNC_TO_DIM={  'Armazenamento e Operações':1,  'Modelagem e Desenho':2,  'Integração e Interoperabilidade':3,  'Integração (continuação)':3,  'Segurança de Dados':4,  'Segurança (continuação)':4,  'Metadados':5,  'Metadados (consolidação)':5,  'Arquitetura de Dados':6,  'Qualidade de Dados':7,  'Qualidade (continuação)':7,  'Governança de Dados':8,  'Governança (continuação)':8,  'Gestão de Documentos':9,  'Dados Mestre e Referência':10,  'Dados Mestre (consolidação)':10,  'Data Warehousing e BI':11,  'DW e BI (continuação)':11,  'Big Data e Analytics':12,  'Analytics (continuação)':12,  'Governança + Qualidade':8,  'DW + Analytics':11,  'Analytics + Inovação':12,};
// ═══════════════════════════════════════════════════════════════════════// PIRÂMIDE AIKEN ADAPTADA// ═══════════════════════════════════════════════════════════════════════const PYR = [  {dims:[1,2,3], label:'1 · 2 · 3'},  {dims:[4,5],   label:'4 · 5'},  {dims:[6,7],   label:'6 · 7'},  {dims:[8,9],   label:'8 · 9'},  {dims:[10,11], label:'10 · 11'},  {dims:[12],    label:'12'},];
function pyrSVG(status){  const W=164, H=150, ax=W/2;  const N=PYR.length;  const lh=H/N;  const lx = y => ax - ax*(y/H);  const rx = y => ax + ax*(y/H);  function layerState(dims){    let best='locked', col='#0a1828';    dims.forEach(d=>{      const st=status[d]||'locked';      if(st==='active'){best='active'; col=C[d];}      else if(st==='done'&&best!=='active'){best='done'; col=C[d];}    });    return {best, col};  }  let svg='';  svg+=`<defs><clipPath id="tc"><polygon points="${ax},0 0,${H} ${W},${H}"/></clipPath></defs>`;  svg+=`<polygon points="${ax},0 0,${H} ${W},${H}" fill="#030810"/>`;  PYR.forEach((layer, pyrIdx)=>{    const triLayerIdx = N - 1 - pyrIdx;    const y1 = triLayerIdx * lh;    const y2 = (triLayerIdx + 1) * lh;    const {best, col} = layerState(layer.dims);    const op = best==='active' ? 1 : best==='done' ? 0.65 : 0.13;    const pts=`${lx(y1)},${y1} ${rx(y1)},${y1} ${rx(y2)},${y2} ${lx(y2)},${y2}`;    svg+=`<polygon clip-path="url(#tc)" points="${pts}" fill="${col}" opacity="${op}" stroke="rgba(255,255,255,.15)" stroke-width="0.6"/>`;    if(triLayerIdx>0){      svg+=`<line x1="${lx(y1)}" y1="${y1}" x2="${rx(y1)}" y2="${y1}" stroke="rgba(255,255,255,.2)" stroke-width="0.7"/>`;    }    if(layer.dims.length>1){      const cy=(y1+y2)/2;      const rowW=rx(cy)-lx(cy);      const segW=rowW/layer.dims.length;      for(let si=1;si<layer.dims.length;si++){        const sx=lx(cy)+segW*si;        svg+=`<line clip-path="url(#tc)" x1="${sx}" y1="${y1}" x2="${sx}" y2="${y2}" stroke="rgba(255,255,255,.15)" stroke-width="0.5"/>`;      }    }    const cy=(y1+y2)/2;    layer.dims.forEach((d,di)=>{      let tx;      if(layer.dims.length===1){        tx=ax;      } else {        const rowW=rx(cy)-lx(cy);        const segW=rowW/layer.dims.length;        tx=lx(cy)+segW*di+segW/2;      }      const isAct=(status[d]||'locked')==='active';      const isLk=(status[d]||'locked')==='locked';      const fc=isLk?'rgba(255,255,255,.15)':isAct?'#ffffff':'rgba(255,255,255,.7)';      const fw=isAct?'800':'600';      const fs=isAct?9:8;      svg+=`<text x="${tx}" y="${cy+3.5}" text-anchor="middle" font-family="Arial" font-size="${fs}" font-weight="${fw}" fill="${fc}">${d}</text>`;    });  });  svg+=`<polygon points="${ax},0 0,${H} ${W},${H}" fill="none" stroke="rgba(100,160,220,.5)" stroke-width="1.5"/>`;  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${svg}</svg>`;}
// ═══════════════════════════════════════════════════════════════════════// RADAR NIGHTINGALE// ═══════════════════════════════════════════════════════════════════════const DS=['Arm.','Mod.','Int.','Seg.','Meta.','Arq.','Qual.','Gov.','Doc.','MDM','DW/BI','BD/An.'];
function nightingale(bA, aA, aIdx){  const N=12, W=158, H=158, cx=W/2, cy=H/2, R=52;  const step=(2*Math.PI)/N;  const ang=i=>-Math.PI/2+i*step;  let out='';  [1,2,3,4,5].forEach(v=>{    const r=(v/DIM_MAX)*R;    out+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,.055)" stroke-width="0.4"/>`;    if(v===1||v===3||v===5) out+=`<text x="${cx+2}" y="${cy-r+3}" font-size="5" fill="#1a3a50" font-family="Arial">${v}</text>`;  });  for(let i=0;i<N;i++){    const a=ang(i);    out+=`<line x1="${cx}" y1="${cy}" x2="${cx+R*Math.cos(a)}" y2="${cy+R*Math.sin(a)}" stroke="rgba(255,255,255,.04)" stroke-width="0.4"/>`;  }  for(let i=0;i<N;i++){    const isAct=(i===aIdx);    const a1=ang(i)-step/2, a2=ang(i)+step/2;    const rb=(bA[i]/DIM_MAX)*R, ra=(aA[i]/DIM_MAX)*R;    const col=C[i+1];    const isDone=bA[i]>1.0;    const opB=isAct?0.38:isDone?0.22:0.06;    const opD=isAct?0.92:isDone?0.48:0.1;    const x1b=cx+rb*Math.cos(a1),y1b=cy+rb*Math.sin(a1);    const x2b=cx+rb*Math.cos(a2),y2b=cy+rb*Math.sin(a2);    out+=`<path d="M${cx},${cy}L${x1b},${y1b}A${rb},${rb},0,0,1,${x2b},${y2b}Z" fill="${col}" opacity="${opB}"/>`;    if(ra>rb){      const x1a=cx+ra*Math.cos(a1),y1a=cy+ra*Math.sin(a1);      const x2a=cx+ra*Math.cos(a2),y2a=cy+ra*Math.sin(a2);      out+=`<path d="M${x1b},${y1b}L${x1a},${y1a}A${ra},${ra},0,0,1,${x2a},${y2a}L${x2b},${y2b}A${rb},${rb},0,0,0,${x1b},${y1b}Z" fill="${col}" opacity="${opD}"${isAct?' stroke="#fff" stroke-width="0.5"':''}/>`;    }    const lr=R+15, la=ang(i);    const lxr=cx+lr*Math.cos(la), lyr=cy+lr*Math.sin(la);    const anch=Math.abs(lxr-cx)<3?'middle':lxr>cx?'start':'end';    out+=`<text x="${lxr}" y="${lyr+2}" text-anchor="${anch}" font-family="Arial" font-size="${isAct?7:5.5}" fill="${isAct?'#c0daf5':'#2a5068'}" font-weight="${isAct?'700':'400'}">${DS[i]}</text>`;  }  out+=`<circle cx="${cx}" cy="${cy}" r="10" fill="#030810" stroke="#1a3050" stroke-width="1"/>  <text x="${cx}" y="${cy+2}" text-anchor="middle" font-size="5" fill="#2a5070" font-family="Arial" font-weight="700">DMBOK</text>`;  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${out}</svg>`;}
function deltaHTML(b, a, nm, col){  const g=(a-b).toFixed(2);  return `<div class="dt-name" style="color:${col}">${nm}</div><div class="dt-row"><div class="dt-lbl">Antes</div><div class="dt-bw"><div class="dt-bi" style="width:${(b/DIM_MAX*100).toFixed(0)}%;background:${col}44"></div></div><div class="dt-val" style="color:${col}77">${b.toFixed(1)}</div></div><div class="dt-row"><div class="dt-lbl">Depois</div><div class="dt-bw"><div class="dt-bi" style="width:${(a/DIM_MAX*100).toFixed(0)}%;background:${col}"></div></div><div class="dt-val" style="color:${col}">${a.toFixed(1)}</div></div><div class="dt-gain" style="color:${+g>0?'#16a34a':'#2a5070'}">+${g} pts &nbsp;·&nbsp; máx ${DIM_MAX}.0</div>`;}

// SCORES PER CHECKPOINTconst RADAR_CHECKPOINTS = {  1: [2, 3, 3, 3, 4],  2: [2, 2, 3, 3, 3],  3: [1, 2, 2, 3, 3],  4: [1, 1, 2, 3, 3],  5: [1, 1, 2, 2, 3],  6: [1, 1, 2, 3, 3],  7: [1, 1, 1, 2, 3],  8: [1, 1, 2, 2, 3],  9: [1, 1, 1, 2, 2],  10:[1, 1, 1, 2, 3],  11:[1, 1, 1, 1, 2],  12:[1, 1, 1, 1, 2],};
function getScores(qIdx){  const groups=[[0,2],[3,5],[6,8],[9,11]];  let grp=0, pos=0;  for(let g=0;g<groups.length;g++){    if(qIdx>=groups[g][0]&&qIdx<=groups[g][1]){      grp=g;      pos=(qIdx-groups[g][0])/(groups[g][1]-groups[g][0]+1);      break;    }  }  const b=[], a=[];  for(let d=1;d<=12;d++){    const cp=RADAR_CHECKPOINTS[d];    const vBefore=cp[grp]+pos*(cp[grp+1]-cp[grp]);    const vAfter=cp[grp]+(pos+1/(groups[grp][1]-groups[grp][0]+1))*(cp[grp+1]-cp[grp]);    b.push(+vBefore.toFixed(2));    a.push(+Math.min(vAfter,DIM_MAX).toFixed(2));  }  return {b, a};}
