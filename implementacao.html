<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>SCDIO — Pirâmide Aiken Adaptada · IPPUC</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      /* Design System Original - Tamanhos Maiores */
      --ink:        #0a1118;
      --ink2:       #111c27;
      --ink3:       #162030;
      --line:       #1e3448;
      --line2:      #284258;
      --blue:       #1e5a9e;
      --blue-l:     #2e75b6;
      --blue-xl:    #5ba3d9;
      --gold:       #c8a84b;
      --gold-l:     #e0c97a;
      --text:       #d0dce8;
      --text-muted: #8ca5be;
      --text-dim:   #4e6b82;
      --white:      #f0f6ff;
      --r:          6px;
      --r2:         10px;
      
      --f-display:  'DM Serif Display', Georgia, serif;
      --f-body:     'Inter', system-ui, sans-serif;
      --f-mono:     'DM Mono', 'Fira Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--f-body);
      background: var(--ink);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ═══ SITE NAV INJETADO E REDIMENSIONADO ═══ */
    .site-nav {
      position: sticky; top: 0; z-index: 9999;
      background: rgba(8,15,26,.97);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
      padding: 0 24px;
      display: flex; align-items: stretch; justify-content: space-between;
      height: 56px; font-family: var(--f-body);
    }
    .site-nav-logo {
      display: flex; align-items: center; gap: 6px;
      text-decoration: none; font-size: 18px; font-weight: 700;
      color: var(--white); letter-spacing: .02em;
    }
    .site-nav-logo .gold { color: var(--gold); }
    .site-nav-logo small {
      font-family: var(--f-mono); font-size: 11px; color: var(--text-muted); font-weight: 500;
      letter-spacing: .08em; text-transform: uppercase;
      margin-left: 6px; align-self: flex-end; padding-bottom: 4px;
    }
    .site-nav-links {
      display: flex; align-items: stretch; gap: 4px; list-style: none;
      margin: 0; padding: 0;
    }
    .site-nav-links li { display: flex; }
    .site-nav-links a {
      display: flex; align-items: center;
      padding: 0 16px;
      font-size: 12px; font-weight: 600;
      letter-spacing: .05em; text-transform: uppercase;
      color: var(--text-muted); text-decoration: none;
      border-bottom: 3px solid transparent;
      transition: color .2s, border-color .2s;
    }
    .site-nav-links a:hover, .site-nav-links a.active {
      color: var(--white); border-bottom-color: var(--gold);
    }
    .site-nav-dl {
      display: flex; align-items: center;
      padding: 0 16px; margin: 10px 0;
      font-size: 12px; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase;
      color: var(--gold-l); text-decoration: none;
      border: 1px solid var(--gold); border-radius: 6px;
      transition: background .2s, color .2s;
    }
    .site-nav-dl:hover { background: var(--gold); color: var(--ink); }

    /* ═══ HEADER ═══ */
    .hdr {
      background: var(--ink2);
      border-bottom: 1px solid var(--line);
      padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      flex-wrap: wrap;
    }
    .hdr-t { font-size: 16px; font-weight: 600; color: var(--white); line-height: 1.2; letter-spacing: -0.01em; }
    .hdr-s { font-size: 11px; font-family: var(--f-mono); color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .nav { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    
    .btn {
      background: rgba(30,90,158,.2); color: var(--blue-xl);
      border: 1px solid rgba(46,117,182,.4); border-radius: var(--r);
      padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: .2s; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .btn:hover:not(:disabled) { background: var(--blue-l); color: var(--white); border-color: var(--blue-l); }
    .btn:disabled { opacity: .3; cursor: default; }
    .btn-p { background: var(--blue); color: var(--white); border-color: var(--blue); }
    .btn-p:hover:not(:disabled) { background: var(--blue-l); }
