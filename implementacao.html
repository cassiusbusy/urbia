<!DOCTYPE html>
<html lang="pt-BR">
<head>

    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap');
    :root { --ink: #0a1118; --ink2: #111c27; --ink3: #162030; --line: #1e3448; --blue: #1e5a9e; --blue-xl: #5ba3d9; --text: #d0dce8; --white: #f0f6ff; --gold: #c8a84b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--ink); color: var(--text); min-height: 100vh; }
    .site-nav { background: #080f1a; border-bottom: 1px solid var(--line); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 50px; }

    .hdr { background: var(--ink2); padding: 15px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
    .nav { display: flex; align-items: center; gap: 10px; }
    #jt { width: 320px; padding: 8px; background: var(--ink3); color: white; border: 1px solid var(--line); border-radius: 4px; }
    .btn { padding: 8px 16px; background: var(--blue); color: white; border: none; border-radius: 4px; cursor: pointer; }
    .wrap { display: grid; grid-template-columns: 320px 320px 1fr; gap: 20px; padding: 20px; }
    .lc, .cc, .rc { display: flex; flex-direction: column; gap: 15px; }
  </style>
</head>
