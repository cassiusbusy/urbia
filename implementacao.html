<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pirâmide Aiken Adaptada · IPPUC</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap');
    :root {
      --ink: #0a1118; --ink2: #111c27; --ink3: #162030; --line: #1e3448; --line2: #284258;
      --blue: #1e5a9e; --blue-l: #2e75b6; --blue-xl: #5ba3d9; --gold: #c8a84b; --gold-l: #e0c97a;
      --text: #d0dce8; --text-muted: #8ca5be; --text-dim: #4e6b82; --white: #f0f6ff;
      --r: 6px; --r2: 10px;
      --f-display: 'DM Serif Display', Georgia, serif;
      --f-body: 'Inter', system-ui, sans-serif;
      --f-mono: 'DM Mono', 'Fira Code', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--f-body); background: var(--ink); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.6; }

    /* Nav e Header */
    .site-nav { position: sticky; top: 0; z-index: 9999; background: rgba(8,15,26,.97); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); padding: 0 24px; display: flex; align-items: stretch; justify-content: space-between; height: 56px; }
    .site-nav-logo { display: flex; align-items: center; gap: 6px; text-decoration: none; font-size: 18px; font-weight: 700; color: var(--white); }
    .site-nav-logo .gold { color: var(--gold); }
    .site-nav-links { display: flex; align-items: stretch; gap: 4px; list-style: none; }
    .site-nav-links a { display: flex; align-items: center; padding: 0 16px; font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); text-decoration: none; border-bottom: 3px solid transparent; }
    .site-nav-links a:hover, .site-nav-links a.active { color: var(--white); border-bottom-color: var(--gold); }
    .site-nav-dl { display: flex; align-items: center; padding: 0 16px; margin: 10px 0; font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--gold-l); border: 1px solid var(--gold); border-radius: 6px; }
    
    .hdr { background: var(--ink2); border-bottom: 1px solid var(--line); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .hdr-t { font-size: 16px; font-weight: 600; color: var(--white); }
    .hdr-s { font-size: 11px; font-family: var(--f-mono); color: var(--blue-xl); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
    
    .nav { display: flex; align-items: center; gap: 12px; }
    .btn { background: rgba(30,90,158,.2); color: var(--blue-xl); border: 1px solid rgba(46,117,182,.4); border-radius: var(--r); padding: 8px 16px; font-size: 12px; cursor: pointer; text-transform: uppercase; }
    .btn-p { background: var(--blue); color: var(--white); border-color: var(--blue); }
    .sel { background: var(--ink3); color: var(--white); border: 1px solid var(--line2); border-radius: var(--r); padding: 8px 12px; font-size: 12px; cursor: pointer; }
    #jt { width: 340px; }
    .pgw { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--text-muted); }
    .pgb { width: 120px; height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; }
    .pgf { height: 100%; background: var(--blue-xl); border-radius: 3px; transition: width .4s; }

    .stage { display: flex; align-items: center; gap: 16px; padding: 20px 24px 10px; }
    .stg-n { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-family: var(--f-display); color: #fff; }
    .stg-h { font-size: 22px; font-weight: 600; color: var(--white); }

    .wrap { display: grid; grid-template-columns: 320px 320px minmax(700px, 1fr); gap: 16px; padding: 12px 24px 32px; overflow-x: auto; }
    .lc, .cc, .rc { display: flex; flex-direction: column; gap: 12px; }
    .pyr-wrap, .rad-wrap, .ibox, .bl-wrap, .mc { background: var(--ink2); border: 1px solid var(--line); border-radius: var(--r2); padding: 16px; }
    .pyr-cap, .rad-cap { font-size: 11px; font-family: var(--f-mono); text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; text-align: center; }
    .bli { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--r); cursor: pointer; background: var(--ink); border: 1px solid transparent; }
    .bli.cur { background: rgba(30,90,158,.15); color: var(--white); border-color: var(--line2); }
    .mc-h { font-size: 15px; font-weight: 600; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 8px; }
    .mc-l { font-size: 10px; font-family: var(--f-mono); color: var(--text-dim); text-transform: uppercase; }
  </style>
</head>
<body>
<nav class="site-nav">
  <a href="#" class="site-nav-logo">URBI<span class="gold">.A.</span><small style="font-family: var(--f-mono); font-size: 10px; color: #666; margin-left: 5px;">IPPUC · Curitiba</small></a>
  <ul class="site-nav-links">
    <li><a href="#">Início</a></li>
    <li><a href="#">Resumo</a></li>
    <li><a href="#">Implementação</a></li>
  </ul>
  <a href="#" class="site-nav-dl">↓ Downloads</a>
</nav>

<div class="hdr">
  <div>
    <div class="hdr-t">Implementação DMBOK / Pirâmide Aiken Adaptada</div>
    <div class="hdr-s" id="header-meta"></div>
  </div>
  <div class="nav">
    <div class="pgw"><span id="plbl">Tarefa 1/20</span><div class="pgb"><div class="pgf" id="pgf"></div></div></div>
    <button class="btn" id="bprev" onclick="go(-1)">◀ Ant.</button>
    <select class="sel" id="jt" onchange="jmp(+this.value)"></select>
    <button class="btn btn-p" id="bnext" onclick="go(1)">Próx. ▶</button>
  </div>
</div>

<div class="stage">
  <div class="stg-n" id="stgn">1</div>
  <div class="stg-h" id="stgh">Q1 — Armazenamento e Operações</div>
</div>

<div class="wrap" id="wrap">
  <div class="lc" id="lc"></div>
  <div class="cc"><div class="bl-wrap"><div id="blist"></div></div></div>
  <div class="rc" id="rc"></div>
</div>

<script>
const C={1:'#185FA5',2:'#2E75B6',3:'#0F6E56',4:'#7030A0',5:'#1D9E75',6:'#3A86C8',7:'#C9511F',8:'#1F4E79',9:'#666660',10:'#3B6D11',11:'#854F0B',12:'#A32D2D'};
const TAREFAS=[
  {q:'Q1', ciclo:'C01', periodo:'Jan/1–Jan/15 2025', fase:'Fase 1 – Base', funcao:'Armazenamento e Operações', dimAtiva:1, done:[], ind:'22', sec:'URBS, SETRAN, IPPUC', ods:'ODS 3, 11', reuniao:'OPERACIONAL', status:'Concluído'},
  {q:'Q2', ciclo:'C01', periodo:'Jan/16–Jan/31 2025', fase:'Fase 1 – Base', funcao:'Modelagem e Desenho', dimAtiva:2, done:[1], ind:'26', sec:'IPPUC, COHAB-CT', ods:'ODS 1, 10', reuniao:'OPERACIONAL', status:'Concluído'},
  // ... (Adicione as demais tarefas seguindo este padrão)
];

let cur=0;
function render(){
  const t=TAREFAS[cur];
  // Atualiza metadados do cabeçalho
  document.getElementById('header-meta').textContent = 
    `${t.periodo} · ${t.fase} · Ciclo ${t.ciclo} · ${t.ind} indicadores · ${t.sec} · ${t.ods} · ${t.reuniao} · Status: ${t.status}`;
  
  document.getElementById('stgn').textContent=cur+1;
  document.getElementById('stgn').style.background=C[t.dimAtiva];
  document.getElementById('stgh').textContent=`${t.q} — ${t.funcao}`;
  document.getElementById('plbl').textContent=`Tarefa ${cur+1}/${TAREFAS.length}`;
  document.getElementById('pgf').style.width=`${Math.round((cur+1)/TAREFAS.length*100)}%`;
  document.getElementById('bprev').disabled=cur===0;
  document.getElementById('bnext').disabled=cur===TAREFAS.length-1;
}

// Inicialização
TAREFAS.forEach((t,i)=>{
  const o=document.createElement('option');
  o.value=i; o.textContent=`Tarefa ${i+1} — ${t.q}: ${t.funcao}`;
  document.getElementById('jt').appendChild(o);
});

function go(d){ cur=Math.max(0,Math.min(TAREFAS.length-1,cur+d)); render(); }
function jmp(i){ cur=parseInt(i); render(); }
render();
</script>
</body>
</html>
